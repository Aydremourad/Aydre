<!DOCTYPE html>
<html manifest="cache.manifest">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Internet">
<title>Internet</title>
<style type="text/css">
body{margin:0;padding:0;background:#000;color:#fff;font-family:Helvetica,Arial,sans-serif;}
h1{text-align:center;font-size:26px;font-weight:bold;margin:18px 0 22px 0;text-shadow:0 -1px #000;}
.grid{width:300px;margin:0 auto;}
a{display:block;text-decoration:none;color:#fff;margin:0 0 14px 0;}
.row{width:300px;display:table;table-layout:fixed;}
.cell{display:table-cell;width:100px;text-align:center;vertical-align:top;}
.icon{width:57px;height:57px;margin:0 auto 5px auto;border:1px solid #111;border-radius:12px;-webkit-border-radius:12px;overflow:hidden;position:relative;background:#eee;-webkit-box-shadow:0 2px 4px #000,inset 0 1px 1px rgba(255,255,255,.7);}
.icon:after{content:"";position:absolute;left:0;right:0;top:0;height:27px;border-radius:12px 12px 0 0;-webkit-border-radius:12px 12px 0 0;background:-webkit-gradient(linear,left top,left bottom,from(rgba(255,255,255,.42)),to(rgba(255,255,255,0)));pointer-events:none;}
.icon img{position:absolute;width:43px;height:43px;left:7px;top:7px;object-fit:contain;z-index:1;}
.google{background:#fff;}
.wikipedia{background:#fff;}
.apple{background:#050505;}
.maps{background:#fff;}
.youtube{background:#fff;}
.weather{background:-webkit-gradient(linear,left top,left bottom,from(#6db6e8),to(#2d6da3));}
.canterbury{background:#fff;}
.label{text-align:center;font-size:14px;font-weight:bold;text-shadow:0 1px #000;}
</style>
</head>
<body>
<h1>Internet</h1>
<div class="grid">

<div class="row">
<div class="cell"><a href="https://www.google.com/"><div class="icon google"><img src="https://www.google.com/s2/favicons?domain=google.com&amp;sz=128" alt="Google"></div><div class="label">Google</div></a></div>
<div class="cell"><a href="https://en.wikipedia.org/"><div class="icon wikipedia"><img src="https://en.wikipedia.org/static/favicon/wikipedia.ico" alt="Wikipedia"></div><div class="label">Wikipedia</div></a></div>
<div class="cell"><a href="https://www.apple.com/"><div class="icon apple"><img src="https://www.apple.com/favicon.ico" alt="Apple"></div><div class="label">Apple</div></a></div>
</div>

<div class="row">
<div class="cell"><a href="https://maps.google.com/"><div class="icon maps"><img src="https://www.google.com/s2/favicons?domain=maps.google.com&amp;sz=128" alt="Maps"></div><div class="label">Maps</div></a></div>
<div class="cell"><a href="https://www.youtube.com/"><div class="icon youtube"><img src="https://www.youtube.com/favicon.ico" alt="YouTube"></div><div class="label">YouTube</div></a></div>
<div class="cell"><a href="https://weather.com/"><div class="icon weather"><img src="https://weather.com/favicon.ico" alt="Weather"></div><div class="label">Weather</div></a></div>
</div>

<div class="row">
<div class="cell"><a href="https://aydremourad.github.io/Aydre/smith-2g-webapp/"><div class="icon canterbury"><img src="../smith-2g-webapp/img/logocolor.png" alt="Canterbury School"></div><div class="label">Canterbury</div></a></div>
</div>

</div>
</body>
</html>
