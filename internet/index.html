<!DOCTYPE html>
<html manifest="cache.manifest">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Internet">
<title>Internet</title>
<style type="text/css">
body{margin:0;padding:0;background:#000;color:#fff;font-family:Helvetica,Arial,sans-serif;}
h1{text-align:center;font-size:26px;font-weight:bold;margin:18px 0 22px 0;text-shadow:0 -1px #000;}
.grid{width:300px;margin:0 auto;}
a{display:block;text-decoration:none;color:#fff;margin:0 0 12px 0;}
.icon{width:64px;height:64px;margin:0 auto 5px auto;border:1px solid #555;border-radius:12px;background:#333;
background:-webkit-gradient(linear,left top,left bottom,from(#777),color-stop(.5,#333),to(#111));
-webkit-box-shadow:0 2px 4px #000;}
.label{text-align:center;font-size:14px;font-weight:bold;text-shadow:0 1px #000;}
.row{width:300px;display:table;table-layout:fixed;}
.cell{display:table-cell;width:100px;text-align:center;vertical-align:top;}
.letter{font-size:30px;line-height:64px;font-weight:bold;}
</style>
</head>
<body>
<h1>Internet</h1>
<div class="grid">
<div class="row">
<div class="cell"><a href="https://www.google.com/"><div class="icon"><div class="letter">G</div></div><div class="label">Google</div></a></div>
<div class="cell"><a href="https://en.wikipedia.org/"><div class="icon"><div class="letter">W</div></div><div class="label">Wikipedia</div></a></div>
<div class="cell"><a href="https://www.apple.com/"><div class="icon"><div class="letter">A</div></div><div class="label">Apple</div></a></div>
</div>
<div class="row">
<div class="cell"><a href="https://maps.google.com/"><div class="icon"><div class="letter">M</div></div><div class="label">Maps</div></a></div>
<div class="cell"><a href="https://www.youtube.com/"><div class="icon"><div class="letter">Y</div></div><div class="label">YouTube</div></a></div>
<div class="cell"><a href="https://weather.com/"><div class="icon"><div class="letter">W</div></div><div class="label">Weather</div></a></div>
</div>
<div class="row">
<div class="cell"><a href="https://aydremourad.github.io/Aydre/smith-2g-webapp/"><div class="icon"><div class="letter">C</div></div><div class="label">Canterbury</div></a></div>
</div>
</div>
</body>
</html>
