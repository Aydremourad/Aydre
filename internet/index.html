<!DOCTYPE html>
<html manifest="cache.manifest">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Internet">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Internet</title>
<style type="text/css">
body{margin:0;padding:0;background:#000;color:#fff;font-family:Helvetica,Arial,sans-serif;}
h1{text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:27px;font-style:italic;font-weight:normal;margin:18px 0 22px 0;color:#fff;text-shadow:0 1px 1px #000;}
.grid{width:300px;margin:0 auto;}
a{display:block;text-decoration:none;color:#fff;margin:0 0 14px 0;}
.row{width:300px;display:table;table-layout:fixed;}
.cell{display:table-cell;width:100px;text-align:center;vertical-align:top;}
.icon{width:57px;height:57px;margin:0 auto 5px auto;border:1px solid #333;border-radius:12px;-webkit-border-radius:12px;overflow:hidden;position:relative;background:#000;-webkit-box-shadow:0 2px 4px #000;text-align:center;line-height:57px;font-size:32px;font-weight:bold;font-family:Helvetica,Arial,sans-serif;color:#fff;}
.label{text-align:center;font-size:14px;font-weight:bold;text-shadow:0 1px #000;}
</style>
</head>
<body>
<h1>World Wide Web</h1>
<div class="grid">
<div class="row">
<div class="cell"><a href="https://www.google.com/"><div class="icon">G</div><div class="label">Google</div></a></div>
<div class="cell"><a href="https://en.wikipedia.org/"><div class="icon">W</div><div class="label">Wikipedia</div></a></div>
<div class="cell"><a href="https://www.apple.com/"><div class="icon">A</div><div class="label">Apple</div></a></div>
</div>
<div class="row">
<div class="cell"><a href="https://maps.google.com/"><div class="icon">M</div><div class="label">Maps</div></a></div>
<div class="cell"><a href="https://www.youtube.com/"><div class="icon">Y</div><div class="label">YouTube</div></a></div>
<div class="cell"><a href="https://weather.com/"><div class="icon">W</div><div class="label">Weather</div></a></div>
</div>
<div class="row">
<div class="cell"><a href="https://aydremourad.github.io/Aydre/apps-2g-webapp/"><div class="icon">A</div><div class="label">Apps</div></a></div>
<div class="cell"><a href="https://aydremourad.github.io/Aydre/smith-2g-webapp/"><div class="icon"><img src="icons/canterbury.png" alt="Canterbury School" style="width:57px;height:57px;"></div><div class="label">Canterbury</div></a></div>
<div class="cell"></div>
</div>
</div>
</body>
</html>
