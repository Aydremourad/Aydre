<!DOCTYPE html>
<html manifest="cache.manifest">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Internet">
<title>Internet</title>
<style type="text/css">
body{margin:0;padding:0;background:#000;color:#fff;font-family:Helvetica,Arial,sans-serif;}
h1{text-align:center;font-size:26px;font-weight:bold;margin:18px 0 22px 0;text-shadow:0 -1px #000;}
.grid{width:300px;margin:0 auto;}
a{display:block;text-decoration:none;color:#fff;margin:0 0 14px 0;}
.row{width:300px;display:table;table-layout:fixed;}
.cell{display:table-cell;width:100px;text-align:center;vertical-align:top;}
.icon{width:64px;height:64px;margin:0 auto 4px auto;border:1px solid #222;border-radius:13px;-webkit-box-shadow:0 2px 4px #000, inset 0 1px 1px rgba(255,255,255,.45);position:relative;overflow:hidden;}
.icon:after{content:"";position:absolute;left:1px;right:1px;top:1px;height:30px;border-radius:12px 12px 0 0;background:-webkit-gradient(linear,left top,left bottom,from(rgba(255,255,255,.42)),to(rgba(255,255,255,0)));pointer-events:none;}
.g{background:-webkit-gradient(linear,left top,left bottom,from(#fff),to(#d7d7d7));color:#4285f4;}
.w{background:-webkit-gradient(linear,left top,left bottom,from(#e8e8e8),to(#aaa));color:#222;}
.a{background:-webkit-gradient(linear,left top,left bottom,from(#222),to(#050505));color:#fff;}
.m{background:-webkit-gradient(linear,left top,left bottom,from(#8fd05a),to(#39752b));color:#fff;}
.y{background:-webkit-gradient(linear,left top,left bottom,from(#fff),to(#d7d7d7));color:#d22;}
.t{background:-webkit-gradient(linear,left top,left bottom,from(#777),to(#222));color:#fff;}
.c{background:-webkit-gradient(linear,left top,left bottom,from(#fff),to(#ddd));color:#111;}
.letter{position:relative;z-index:2;font-size:32px;line-height:64px;font-weight:bold;text-shadow:0 1px 1px rgba(0,0,0,.35);}
.label{text-align:center;font-size:14px;font-weight:bold;text-shadow:0 1px #000;}
</style>
</head>
<body>
<h1>Internet</h1>
<div class="grid">
<div class="row">
<div class="cell"><a href="https://www.google.com/"><div class="icon g"><div class="letter">G</div></div><div class="label">Google</div></a></div>
<div class="cell"><a href="https://en.wikipedia.org/"><div class="icon w"><div class="letter">W</div></div><div class="label">Wikipedia</div></a></div>
<div class="cell"><a href="https://www.apple.com/"><div class="icon a"><div class="letter"></div></div><div class="label">Apple</div></a></div>
</div>
<div class="row">
<div class="cell"><a href="https://maps.google.com/"><div class="icon m"><div class="letter">M</div></div><div class="label">Maps</div></a></div>
<div class="cell"><a href="https://www.youtube.com/"><div class="icon y"><div class="letter">▶</div></div><div class="label">YouTube</div></a></div>
<div class="cell"><a href="https://weather.com/"><div class="icon t"><div class="letter">☼</div></div><div class="label">Weather</div></a></div>
</div>
<div class="row">
<div class="cell"><a href="https://aydremourad.github.io/Aydre/smith-2g-webapp/"><div class="icon c"><div class="letter">C</div></div><div class="label">Canterbury</div></a></div>
</div>
</div>
</body>
</html>
